# capstone.yaml — Submission Manifest
# Keep in sync with reality. This is machine-checked (Layer-1 gate:
# files present, `run` boots, `test` is green) before Layer-2 probes
# ever run.

project: usage-metering-billing-engine
repo: https://github.com/<your-username>/flyrank-capstone-metering-billing
stack:
  language: python
  framework: fastapi
  database: postgresql
  orm: sqlalchemy
  migrations: alembic
  payments: stripe-test-mode
  testing: pytest

run: docker compose up --build
test: docker compose exec api pytest

env_required:
  - DATABASE_URL
  - STRIPE_SECRET_KEY
  - STRIPE_WEBHOOK_SECRET

scope:
  plans: 2          # Free, Pro
  usage_types: 2    # api_calls, ai_tokens
  billable_endpoints: 1  # POST /generate

non_goal: "Proration calculation on mid-cycle subscription downgrades, automatic PDF invoice generation, email dispatch of invoices, and implementing real authentication/authorization mechanisms (like API keys or JWT verification, scoping identity solely to header values) are non-goals for the core engine."

status: in-progress  # in-progress | ships | solid | exceptional
